<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Friday Night Funky Muk</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

@keyframes bgPulse {
  0%, 100% { background-color: #0a0412; }
  50% { background-color: #08030e; }
}
@keyframes floatIdle {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes slimeIdle {
  0%, 100% { transform: scaleX(1) scaleY(1); }
  25% { transform: scaleX(1.04) scaleY(0.96); }
  75% { transform: scaleX(0.97) scaleY(1.03); }
}
@keyframes ratingFade {
  0% { transform: translate(-50%, 0) scale(1.4); opacity: 1; }
  100% { transform: translate(-50%, 30px) scale(0.7); opacity: 0; }
}
@keyframes stinkFloat {
  0% { transform: translateY(0) scaleX(1); opacity: 0.5; }
  100% { transform: translateY(-25px) scaleX(1.5); opacity: 0; }
}
@keyframes dripAnim {
  0%, 100% { height: 18px; }
  50% { height: 32px; }
}
@keyframes neonFlicker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.75; }
}
@keyframes countPop {
  0% { transform: translate(-50%,-50%) scale(0.3); opacity: 0; }
  50% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
  100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
}

body {
  background: #0a0412;
  color: #fff;
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
  animation: bgPulse 3s ease-in-out infinite;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

/* ===== Screens ===== */
.screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  background: radial-gradient(ellipse at center, #110820, #0a0412);
}
.screen.hidden { display: none; }

.title-text {
  font-size: clamp(28px, 6vw, 52px);
  font-weight: 900;
  background: linear-gradient(135deg, #4ade80, #fbbf24, #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
  letter-spacing: 2px;
  text-align: center;
}
.title-sub {
  font-size: clamp(16px, 3vw, 26px);
  color: #7c3aed;
  margin-bottom: clamp(20px, 4vh, 50px);
  animation: neonFlicker 2s infinite;
}

.title-chars {
  display: flex;
  gap: clamp(20px, 6vw, 80px);
  align-items: flex-end;
  margin-bottom: clamp(20px, 4vh, 50px);
}
.title-char-box { text-align: center; }
.title-char-label { font-size: 16px; font-weight: bold; margin-top: 8px; }
.title-char-label.p1c { color: #4ade80; }
.title-char-label.p2c { color: #c084fc; }
.vs-text {
  font-size: clamp(32px, 5vw, 52px);
  font-weight: 900;
  color: #ef4444;
  text-shadow: 0 0 20px rgba(239,68,68,0.5);
  align-self: center;
  margin-bottom: 40px;
}

.menu-btn {
  padding: 14px 44px;
  font-size: clamp(16px, 2.5vw, 22px);
  font-weight: bold;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  margin: 6px;
  font-family: inherit;
  min-height: 48px;
}
.menu-btn:active { transform: scale(0.96); }
.menu-btn.primary {
  background: linear-gradient(135deg, #4ade80, #22c55e);
  color: #111;
  box-shadow: 0 0 18px rgba(74,222,128,0.35);
}
.menu-btn.secondary {
  background: linear-gradient(135deg, #a855f7, #7c3aed);
  color: #fff;
  box-shadow: 0 0 18px rgba(168,85,247,0.35);
}
.menu-btn.warning {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #111;
}

/* Song select */
.song-title { font-size: clamp(24px, 4vw, 36px); margin-bottom: 30px; color: #fbbf24; }
.song-list {
  display: flex; flex-direction: column; gap: 10px;
  max-height: 50vh; overflow-y: auto; padding: 0 20px;
  -webkit-overflow-scrolling: touch;
}
.song-item {
  padding: 14px 28px;
  background: rgba(255,255,255,0.07);
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-width: min(340px, 85vw);
  min-height: 48px;
  transition: all 0.15s;
}
.song-item:active { background: rgba(168,85,247,0.3); border-color: #a855f7; }
.song-bpm { font-size: 12px; color: #a78bfa; }

/* Controls screen */
.controls-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px 40px;
  text-align: center;
  font-size: 15px;
  line-height: 1.8;
}
.controls-grid h3 { margin-bottom: 6px; font-size: 18px; }

/* ===== Game Screen ===== */
#gameScreen {
  background: #0a0412;
  justify-content: flex-start;
}

/* HUD */
#hud {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px clamp(10px, 2vw, 30px);
  height: 44px;
  background: rgba(0,0,0,0.6);
  z-index: 10;
  flex-shrink: 0;
}
.player-info { display: flex; align-items: center; gap: 8px; }
.player-name { font-size: 14px; font-weight: bold; text-shadow: 0 0 8px currentColor; }
.p1-name { color: #4ade80; }
.p2-name { color: #c084fc; }
.hud-score { font-weight: bold; font-size: 15px; }
.p1-score { color: #4ade80; }
.p2-score { color: #c084fc; }

#healthBarCenter {
  width: clamp(160px, 30vw, 420px);
  height: 22px;
  background: #111;
  border-radius: 11px;
  border: 2px solid #333;
  overflow: hidden;
  display: flex;
  position: relative;
}
#healthBarCenter .half { width: 50%; height: 100%; }
#healthBarCenter .half.left { display: flex; justify-content: flex-end; }
.health-bar-fill { height: 100%; transition: width 0.3s ease; }
#p1HealthFill { background: linear-gradient(90deg, #16a34a, #4ade80); width: 50%; }
#p2HealthFill { background: linear-gradient(90deg, #c084fc, #7c3aed); width: 50%; }
#healthIcon {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%,-50%);
  font-size: 16px; z-index: 2;
}

/* Progress */
#songProgress { width: 100%; height: 3px; background: rgba(255,255,255,0.08); flex-shrink: 0; }
#songProgressFill { height: 100%; width: 0%; background: linear-gradient(90deg, #4ade80, #fbbf24, #c084fc); transition: width 0.5s linear; }

/* ===== Stage: the main game area ===== */
#stage {
  flex: 1;
  display: flex;
  width: 100%;
  position: relative;
  overflow: hidden;
  min-height: 0;
}

.stage-bg {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, #050210 0%, #0a0412 30%, #0f0620 100%);
}

/* Each player side */
.player-side {
  width: 50%;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 2;
}

.player-side .side-divider {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 1px;
  background: linear-gradient(180deg, transparent, rgba(255,255,255,0.08), transparent);
}
.player-side.p2-side .side-divider { left: 0; right: auto; }

/* Arrow lanes area (top portion) */
.arrow-area {
  flex: 1;
  position: relative;
  display: flex;
  justify-content: center;
  overflow: hidden;
  min-height: 0;
}

.lane-group {
  display: flex;
  gap: 2px;
  height: 100%;
  position: relative;
}

.lane {
  width: clamp(48px, 10vw, 76px);
  height: 100%;
  position: relative;
}

/* Target zone at TOP of lane */
.target-zone {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: clamp(42px, 9vw, 68px);
  height: clamp(42px, 9vw, 68px);
  border-radius: 8px;
  border: 3px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.04);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(20px, 4vw, 30px);
  transition: all 0.08s;
  z-index: 3;
}
.target-zone.active {
  background: rgba(255,255,255,0.18);
  border-color: rgba(255,255,255,0.6);
  box-shadow: 0 0 18px rgba(255,255,255,0.25);
}
.lane.p1 .target-zone { border-color: rgba(74,222,128,0.35); color: rgba(74,222,128,0.7); }
.lane.p1 .target-zone.active {
  border-color: #4ade80; background: rgba(74,222,128,0.2);
  box-shadow: 0 0 22px rgba(74,222,128,0.4);
}
.lane.p2 .target-zone { border-color: rgba(192,132,252,0.35); color: rgba(192,132,252,0.7); }
.lane.p2 .target-zone.active {
  border-color: #c084fc; background: rgba(192,132,252,0.2);
  box-shadow: 0 0 22px rgba(192,132,252,0.4);
}

.key-label {
  position: absolute;
  top: clamp(56px, 10vw, 82px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: rgba(255,255,255,0.25);
  font-weight: bold;
  z-index: 3;
}

/* Notes (flow bottom-to-top) */
.note {
  position: absolute;
  width: clamp(40px, 8.5vw, 64px);
  height: clamp(40px, 8.5vw, 64px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(20px, 4vw, 30px);
  border-radius: 8px;
  pointer-events: none;
  z-index: 2;
}
.note.p1 {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  box-shadow: 0 0 12px rgba(34,197,94,0.5);
  color: #fff;
}
.note.p2 {
  background: linear-gradient(135deg, #c084fc, #7c3aed);
  box-shadow: 0 0 12px rgba(192,132,252,0.5);
  color: #fff;
}

/* Rating popup */
.rating-popup {
  position: absolute;
  font-size: clamp(16px, 3vw, 24px);
  font-weight: bold;
  pointer-events: none;
  z-index: 20;
  animation: ratingFade 0.7s ease-out forwards;
  text-shadow: 0 0 8px currentColor;
  white-space: nowrap;
}
.rating-popup.perfect { color: #fbbf24; }
.rating-popup.great { color: #4ade80; }
.rating-popup.good { color: #60a5fa; }
.rating-popup.miss { color: #ef4444; }

/* Combo display */
.combo-display {
  position: absolute;
  top: clamp(70px, 12vw, 100px);
  left: 50%;
  transform: translateX(-50%);
  font-size: clamp(12px, 2vw, 16px);
  font-weight: bold;
  color: #fbbf24;
  text-shadow: 0 0 8px rgba(251,191,36,0.5);
  z-index: 10;
  pointer-events: none;
  white-space: nowrap;
}

/* ===== Character area (bottom) ===== */
.char-area {
  height: clamp(140px, 28vh, 240px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: clamp(8px, 2vh, 20px);
  flex-shrink: 0;
  position: relative;
}

/* Spotlight under characters */
.char-area::before {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 80%;
  height: 60%;
  background: radial-gradient(ellipse at bottom, rgba(100,50,180,0.1), transparent);
  pointer-events: none;
}

.character { position: relative; }

/* ===== 甜瓜人 Side Profile (facing RIGHT) ===== */
.melon-man {
  width: clamp(90px, 16vw, 160px);
  height: clamp(120px, 22vh, 210px);
  animation: floatIdle 3s ease-in-out infinite;
}
.melon-man .head {
  width: clamp(56px, 10vw, 90px);
  height: clamp(56px, 10vw, 90px);
  background: radial-gradient(circle at 55% 40%, #a0d911, #5a8a0a);
  border-radius: 50%;
  margin: 0 auto;
  position: relative;
  border: 2px solid #3d6b08;
  box-shadow: 0 0 15px rgba(100,180,0,0.3);
}
/* Stem */
.melon-man .head::before {
  content: '';
  position: absolute;
  width: 5px; height: 14px;
  background: #3d6b08;
  top: -12px; left: 55%;
  transform: translateX(-50%) rotate(10deg);
  border-radius: 3px;
}
.melon-man .head .stripe {
  position: absolute;
  width: 2px; height: 70%;
  background: rgba(45,80,22,0.35);
  top: 15%; border-radius: 2px;
}
.melon-man .head .stripe:nth-child(1) { left: 30%; transform: rotate(-8deg); }
.melon-man .head .stripe:nth-child(2) { left: 50%; }
.melon-man .head .stripe:nth-child(3) { left: 70%; transform: rotate(8deg); }
/* Eyes - looking RIGHT */
.melon-man .eyes {
  position: absolute;
  top: 32%; left: 55%;
  display: flex; gap: 10px;
}
.melon-man .eye {
  width: clamp(8px, 1.8vw, 14px);
  height: clamp(10px, 2vw, 17px);
  background: #fff;
  border-radius: 50%;
  position: relative;
}
.melon-man .eye::after {
  content: '';
  position: absolute;
  width: 60%; height: 55%;
  background: #111;
  border-radius: 50%;
  top: 30%; right: 10%;
}
.melon-man .mouth {
  position: absolute;
  bottom: 22%; left: 58%;
  width: clamp(14px, 3vw, 26px);
  height: clamp(6px, 1.2vw, 10px);
  border-radius: 0 0 50% 50%;
  background: #c0392b;
}
.melon-man.singing .mouth {
  height: clamp(12px, 2.2vw, 18px);
  width: clamp(12px, 2.5vw, 20px);
  border-radius: 50%;
}
.melon-man .torso {
  width: clamp(36px, 7vw, 60px);
  height: clamp(44px, 8vw, 72px);
  background: linear-gradient(180deg, #e74c3c, #c0392b);
  margin: -3px auto 0;
  margin-left: clamp(20px, 4vw, 40px);
  border-radius: 8px 8px 4px 4px;
  position: relative;
}
/* Arm reaching right (towards opponent) holding mic */
.melon-man .arm-front {
  position: absolute;
  width: clamp(12px, 2vw, 18px);
  height: clamp(32px, 6vw, 50px);
  background: #e74c3c;
  border-radius: 8px;
  right: -10px; top: 4px;
  transform: rotate(-35deg);
  transform-origin: top center;
  transition: transform 0.12s;
}
.melon-man.singing .arm-front { transform: rotate(-55deg); }
.melon-man .arm-back {
  position: absolute;
  width: clamp(12px, 2vw, 18px);
  height: clamp(28px, 5vw, 44px);
  background: #c0392b;
  border-radius: 8px;
  left: -8px; top: 6px;
  transform: rotate(15deg);
  z-index: -1;
}
/* Mic */
.melon-man .mic {
  position: absolute;
  right: clamp(-28px, -5vw, -40px);
  top: clamp(24px, 5vw, 42px);
  width: 5px; height: clamp(22px, 4vw, 34px);
  background: linear-gradient(180deg, #999, #555);
  border-radius: 3px;
  transform: rotate(-45deg);
}
.melon-man .mic::before {
  content: '';
  position: absolute;
  top: -8px; left: 50%;
  transform: translateX(-50%);
  width: 12px; height: 12px;
  background: radial-gradient(circle, #555, #222);
  border-radius: 50% 50% 30% 30%;
}
.melon-man .legs {
  display: flex; gap: 4px;
  margin-left: clamp(22px, 4.5vw, 42px);
}
.melon-man .leg {
  width: clamp(12px, 2.2vw, 18px);
  height: clamp(28px, 5vw, 42px);
  background: #2c3e50;
  border-radius: 4px 4px 6px 6px;
}
.melon-man .leg .shoe {
  width: clamp(16px, 3vw, 26px);
  height: clamp(7px, 1.4vw, 12px);
  background: #e74c3c;
  border-radius: 5px 8px 3px 3px;
  margin-top: -1px;
}

/* ===== 臭臭泥 Side Profile (facing LEFT) ===== */
.muk {
  width: clamp(100px, 18vw, 180px);
  height: clamp(110px, 20vh, 190px);
  animation: slimeIdle 2.5s ease-in-out infinite;
  transform-origin: bottom center;
}
.muk .body-main {
  width: clamp(80px, 15vw, 140px);
  height: clamp(80px, 15vw, 140px);
  background: radial-gradient(ellipse at 35% 35%, #9b59b6, #6c3483, #3b1460);
  border-radius: 55% 45% 42% 58% / 55% 50% 50% 45%;
  margin: 0 auto;
  position: relative;
  box-shadow: 0 0 25px rgba(155,89,182,0.4);
}
.muk .body-main::before {
  content: '';
  position: absolute;
  width: 60%; height: 25%;
  background: rgba(200,150,255,0.12);
  border-radius: 50%;
  top: 12%; left: 15%;
}
/* Eyes - looking LEFT */
.muk .eyes {
  position: absolute;
  top: 22%; left: 18%;
  display: flex; gap: clamp(12px, 2.5vw, 22px);
}
.muk .eye {
  width: clamp(14px, 3vw, 24px);
  height: clamp(16px, 3.3vw, 28px);
  background: #fff;
  border-radius: 50%;
  position: relative;
  box-shadow: 0 0 6px rgba(255,255,255,0.4);
}
.muk .eye::after {
  content: '';
  position: absolute;
  width: 55%; height: 55%;
  background: #1a0530;
  border-radius: 50%;
  top: 28%; left: 8%;
}
.muk .eye::before {
  content: '';
  position: absolute;
  width: 4px; height: 4px;
  background: #fff;
  border-radius: 50%;
  top: 22%; left: 15%;
  z-index: 1;
}
.muk .mouth {
  position: absolute;
  bottom: 26%; left: 25%;
  width: clamp(24px, 5vw, 44px);
  height: clamp(8px, 1.6vw, 14px);
  background: #1a0530;
  border-radius: 0 0 50% 50%;
}
.muk.singing .mouth {
  height: clamp(16px, 3vw, 26px);
  width: clamp(20px, 4vw, 34px);
  border-radius: 50%;
}
.muk .drip {
  position: absolute;
  background: linear-gradient(180deg, #7d3c98, #5b2d7a);
  border-radius: 0 0 50% 50%;
  animation: dripAnim 3s ease-in-out infinite;
}
.muk .drip:nth-child(1) { width: 18px; left: 10%; bottom: -12px; }
.muk .drip:nth-child(2) { width: 22px; left: 55%; bottom: -16px; animation-delay: 1s; }
.muk .drip:nth-child(3) { width: 14px; left: 35%; bottom: -8px; animation-delay: 0.5s; }
/* Arms */
.muk .arm-sludge {
  position: absolute;
  width: clamp(26px, 5vw, 44px);
  height: clamp(40px, 7vw, 65px);
  background: linear-gradient(180deg, #8e44ad, #5b2d7a);
  border-radius: 20px;
  top: 30%;
  transition: transform 0.12s;
}
.muk .arm-sludge.left-arm {
  left: clamp(-16px, -3vw, -26px);
  transform: rotate(12deg);
}
.muk .arm-sludge.right-arm {
  right: clamp(-16px, -3vw, -26px);
  transform: rotate(-12deg);
}
.muk.singing .arm-sludge.left-arm { transform: rotate(-18deg) translateY(-6px); }
.muk.singing .arm-sludge.right-arm { transform: rotate(18deg) translateY(-6px); }
.muk .base {
  width: clamp(90px, 16vw, 155px);
  height: clamp(18px, 3.5vw, 34px);
  background: radial-gradient(ellipse, #5b2d7a, #3b1460);
  border-radius: 50%;
  margin: -14px auto 0;
  box-shadow: 0 4px 15px rgba(91,45,122,0.5);
}
.muk .stink-lines {
  position: absolute;
  top: -14px; left: 30%;
}
.muk .stink-line {
  position: absolute;
  font-size: 13px;
  color: rgba(155,89,182,0.45);
  animation: stinkFloat 2s ease-out infinite;
}
.muk .stink-line:nth-child(1) { left: -12px; }
.muk .stink-line:nth-child(2) { left: 6px; animation-delay: 0.6s; }
.muk .stink-line:nth-child(3) { left: 24px; animation-delay: 1.2s; }

/* ===== Countdown ===== */
#countdown {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  font-size: clamp(80px, 16vw, 130px);
  font-weight: 900;
  color: #fbbf24;
  text-shadow: 0 0 40px rgba(251,191,36,0.5);
  z-index: 200;
  display: none;
  animation: countPop 0.4s ease-out;
}

/* ===== Pause ===== */
#pauseOverlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 150;
}
#pauseOverlay h2 { font-size: 40px; color: #fbbf24; margin-bottom: 24px; }

/* ===== Touch Controls ===== */
#touchControls {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: clamp(70px, 14vh, 110px);
  z-index: 80;
  padding: 6px clamp(4px, 1.5vw, 12px);
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.7));
}
#touchControls .touch-row {
  display: flex;
  justify-content: center;
  gap: clamp(4px, 1vw, 10px);
  height: 100%;
  align-items: center;
}

<script>
// ===========================
// Audio Engine
// ===========================
const AudioEngine = {
  ctx: null,
  masterGain: null,
  bpm: 120,
  beatInterval: 500,

  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.35;
      this.masterGain.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  setBPM(bpm) { this.bpm = bpm; this.beatInterval = 60000 / bpm; },
  playNote(freq, duration, type = 'square', delay = 0) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + duration);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(t);
    osc.stop(t + duration);
  },
  playBeat() { this.playNote(80, 0.08, 'sine'); },
  playHit(rating) {
    const freqs = { perfect: 880, great: 660, good: 440, miss: 150 };
    const types = { perfect: 'sine', great: 'sine', good: 'triangle', miss: 'sawtooth' };
    this.playNote(freqs[rating] || 440, 0.12, types[rating] || 'sine');
    if (rating === 'perfect') this.playNote(1320, 0.08, 'sine', 0.04);
  },
  playCountdownBeep(high) { this.playNote(high ? 880 : 440, 0.12, 'sine'); }
};

// ===========================
// Songs
// ===========================
const ARROW_SYMBOLS = ['←', '↓', '↑', '→'];
const SONGS = [
  { name: '初次见面', bpm: 100, difficulty: 1, duration: 35, description: '简单的入门曲目' },
  { name: '臭气冲天', bpm: 120, difficulty: 2, duration: 40, description: '臭臭泥开始认真了！' },
  { name: '瓜皮反击', bpm: 140, difficulty: 3, duration: 45, description: '甜瓜人的逆袭时刻' },
  { name: '毒液狂潮', bpm: 160, difficulty: 4, duration: 50, description: '高速节奏大挑战！' },
  { name: '最终决战', bpm: 180, difficulty: 5, duration: 55, description: '终极对决！' },
];

function generateSongPattern(song) {
  const bps = song.bpm / 60;
  const totalBeats = Math.floor(song.duration * bps);
  const pattern = { p1: [], p2: [] };
  let rng = song.bpm * 137 + song.difficulty * 31;
  function rand() { rng = (rng * 1103515245 + 12345) & 0x7fffffff; return rng / 0x7fffffff; }

  const p2Den = 0.3 + song.difficulty * 0.1;
  for (let b = 4; b < totalBeats; b++) {
    if (rand() < p2Den) {
      const lane = Math.floor(rand() * 4);
      const time = (b / bps) * 1000;
      pattern.p2.push({ time, lane, hit: false });
      if (song.difficulty >= 3 && rand() < 0.18) {
        pattern.p2.push({ time, lane: (lane + 1 + Math.floor(rand() * 3)) % 4, hit: false });
      }
    }
  }
  const p1Den = 0.25 + song.difficulty * 0.08;
  for (let b = 4; b < totalBeats; b++) {
    if (rand() < p1Den) {
      const lane = Math.floor(rand() * 4);
      const time = (b / bps) * 1000;
      pattern.p1.push({ time, lane, hit: false });
      if (song.difficulty >= 4 && rand() < 0.14) {
        pattern.p1.push({ time, lane: (lane + 1 + Math.floor(rand() * 3)) % 4, hit: false });
      }
    }
  }
  return pattern;
}

// ===========================
// Game State
// ===========================
const GS = {
  screen: 'title',
  currentSong: null,
  pattern: null,
  startTime: 0,
  elapsed: 0,
  paused: false,
  pauseStart: 0,
  totalPaused: 0,
  gameOver: false,
  scrollSpeed: 0.4, // px per ms

  p1: { score: 0, combo: 0, maxCombo: 0, health: 50, perfect: 0, great: 0, good: 0, miss: 0 },
  p2: { score: 0, combo: 0, maxCombo: 0, health: 50, perfect: 0, great: 0, good: 0, miss: 0 },

  noteElements: new Map(),

  timing: { perfect: 50, great: 100, good: 145, miss: 190 },

  reset() {
    this.elapsed = 0;
    this.paused = false;
    this.totalPaused = 0;
    this.gameOver = false;
    this.p1 = { score: 0, combo: 0, maxCombo: 0, health: 50, perfect: 0, great: 0, good: 0, miss: 0 };
    this.p2 = { score: 0, combo: 0, maxCombo: 0, health: 50, perfect: 0, great: 0, good: 0, miss: 0 };
    this.noteElements.forEach(el => el.remove());
    this.noteElements.clear();
  }
};

// ===========================
// Touch Controls
// ===========================
function touchDown(lane, e) {
  e.preventDefault();
  if (GS.screen !== 'game' || GS.paused || GS.gameOver) return;
  const btn = document.querySelector(`.touch-btn[data-lane="${lane}"]`);
  if (btn) btn.classList.add('active');
  handleNoteHit(1, lane);
  activateTarget(1, lane);
}
function touchUp(lane, e) {
  e.preventDefault();
  const btn = document.querySelector(`.touch-btn[data-lane="${lane}"]`);
  if (btn) btn.classList.remove('active');
  deactivateTarget(1, lane);
}

// ===========================
// Input
// ===========================
const Input = {
  keyMap: { d: 0, D: 0, f: 1, F: 1, j: 2, J: 2, k: 3, K: 3 },
  pressed: new Set(),
  init() {
    document.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.key === 'Escape') { if (GS.screen === 'game') togglePause(); return; }
      if (e.key === 'Enter') { if (GS.screen === 'title') showSongSelect(); return; }
      if (GS.screen !== 'game' || GS.paused || GS.gameOver) return;
      const lane = this.keyMap[e.key];
      if (lane !== undefined && !this.pressed.has(e.key.toLowerCase())) {
        this.pressed.add(e.key.toLowerCase());
        handleNoteHit(1, lane);
        activateTarget(1, lane);
      }
    });
    document.addEventListener('keyup', (e) => {
      this.pressed.delete(e.key.toLowerCase());
      const lane = this.keyMap[e.key];
      if (lane !== undefined) deactivateTarget(1, lane);
    });
  }
};

// ===========================
// UI
// ===========================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  // Show touch controls only during game
  const tc = document.getElementById('touchControls');
  if (id === 'gameScreen') tc.style.removeProperty('display');
  else tc.style.display = 'none';
}

function backToTitle() { GS.screen = 'title'; showScreen('titleScreen'); }
function showControls() { showScreen('controlsScreen'); }

function showSongSelect() {
  GS.screen = 'songSelect';
  const list = document.getElementById('songList');
  list.innerHTML = '';
  SONGS.forEach((song, i) => {
    const item = document.createElement('button');
    item.className = 'song-item';
    const stars = '★'.repeat(song.difficulty) + '☆'.repeat(5 - song.difficulty);
    item.innerHTML = `
      <div><div style="font-weight:bold">${song.name}</div><div style="font-size:12px;color:#888">${song.description}</div></div>
      <div style="text-align:right"><div class="song-bpm">${song.bpm} BPM</div><div style="color:#fbbf24;font-size:12px">${stars}</div></div>`;
    item.onclick = () => startSong(i);
    list.appendChild(item);
  });
  showScreen('songScreen');
}

function activateTarget(player, lane) {
  const t = document.getElementById(`target-p${player}-${lane}`);
  if (t) t.classList.add('active');
}
function deactivateTarget(player, lane) {
  const t = document.getElementById(`target-p${player}-${lane}`);
  if (t) t.classList.remove('active');
}

function showRating(player, lane, rating) {
  const area = document.getElementById(`p${player}ArrowArea`);
  if (!area) return;
  const popup = document.createElement('div');
  popup.className = `rating-popup ${rating}`;
  popup.textContent = rating.toUpperCase();
  popup.style.top = '40px';
  popup.style.left = '50%';
  area.appendChild(popup);
  setTimeout(() => popup.remove(), 700);
}

function updateHUD() {
  document.getElementById('p1Score').textContent = GS.p1.score;
  document.getElementById('p2Score').textContent = GS.p2.score;

  document.getElementById('p1Combo').textContent = GS.p1.combo > 2 ? `${GS.p1.combo} COMBO` : '';
  document.getElementById('p2Combo').textContent = GS.p2.combo > 2 ? `${GS.p2.combo} COMBO` : '';

  const total = GS.p1.health + GS.p2.health;
  document.getElementById('p1HealthFill').style.width = (GS.p1.health / total * 100) + '%';
  document.getElementById('p2HealthFill').style.width = (GS.p2.health / total * 100) + '%';

  if (GS.currentSong) {
    document.getElementById('songProgressFill').style.width =
      Math.min(100, GS.elapsed / (GS.currentSong.duration * 1000) * 100) + '%';
  }
}

function updateCharAnim(player, singing) {
  const el = player === 1 ? document.getElementById('melonMan') : document.getElementById('mukChar');
  if (singing) {
    el.classList.add('singing');
    setTimeout(() => el.classList.remove('singing'), 180);
  }
}

// ===========================
// Notes — bottom-to-top
// ===========================
function getTargetY() { return 12 + 34; } // top:12px + half of target height ~34

function getArrowAreaHeight(player) {
  const area = document.getElementById(`p${player}ArrowArea`);
  return area ? area.offsetHeight : 400;
}

function createNoteElement(note, player) {
  const el = document.createElement('div');
  el.className = `note p${player}`;
  el.textContent = ARROW_SYMBOLS[note.lane];
  const lanes = document.querySelectorAll(`#p${player}Lanes .lane`);
  const laneEl = lanes[note.lane];
  if (!laneEl) return null;
  laneEl.appendChild(el);
  return el;
}

function spawnNotes() {
  if (!GS.pattern) return;
  const elapsed = GS.elapsed;
  const areaH = getArrowAreaHeight(1);
  const travelTime = areaH / GS.scrollSpeed;

  ['p1', 'p2'].forEach(pk => {
    const player = pk === 'p1' ? 1 : 2;
    GS.pattern[pk].forEach((note, i) => {
      const nid = `${pk}-${i}`;
      if (!note.spawned && !note.hit && note.time - elapsed < travelTime + 300 && note.time > elapsed - 300) {
        const el = createNoteElement(note, player);
        if (el) {
          note.spawned = true;
          note.element = el;
          GS.noteElements.set(nid, el);
        }
      }
    });
  });
}

function updateNotes() {
  const elapsed = GS.elapsed;
  const targetY = getTargetY();
  const speed = GS.scrollSpeed;

  ['p1', 'p2'].forEach(pk => {
    const player = pk === 'p1' ? 1 : 2;
    const areaH = getArrowAreaHeight(player);

    GS.pattern[pk].forEach((note, i) => {
      if (!note.spawned || note.hit) return;
      const nid = `${pk}-${i}`;
      const el = note.element;
      if (!el) return;

      const timeDiff = note.time - elapsed;
      // Notes start from bottom (areaH) and move UP to targetY
      const y = targetY + timeDiff * speed;
      el.style.top = y + 'px';

      // Auto-play P2
      if (player === 2 && Math.abs(timeDiff) < 35) {
        note.hit = true;
        el.remove();
        GS.noteElements.delete(nid);
        const rating = Math.random() < 0.6 ? 'perfect' : 'great';
        processHit(2, note.lane, rating);
        activateTarget(2, note.lane);
        setTimeout(() => deactivateTarget(2, note.lane), 100);
      }

      // Missed (went past target upward, i.e. timeDiff very negative)
      if (timeDiff < -GS.timing.miss) {
        if (!note.hit && player === 1) processMiss(1, note.lane);
        note.hit = true;
        el.remove();
        GS.noteElements.delete(nid);
      }

      // Off screen below
      if (y > areaH + 80) {
        el.remove();
        GS.noteElements.delete(nid);
      }
    });
  });
}

// ===========================
// Hit Detection
// ===========================
function handleNoteHit(player, lane) {
  if (!GS.pattern) return;
  const notes = GS.pattern[`p${player}`];
  const elapsed = GS.elapsed;
  let bestNote = null, bestDiff = Infinity;

  for (const note of notes) {
    if (note.hit || note.lane !== lane) continue;
    const diff = Math.abs(note.time - elapsed);
    if (diff < bestDiff && diff < GS.timing.miss) {
      bestDiff = diff;
      bestNote = note;
    }
  }

  if (bestNote) {
    bestNote.hit = true;
    if (bestNote.element) {
      bestNote.element.style.transition = 'opacity 0.1s, transform 0.1s';
      bestNote.element.style.opacity = '0';
      bestNote.element.style.transform = 'translateX(-50%) scale(1.3)';
      setTimeout(() => { if (bestNote.element) bestNote.element.remove(); }, 100);
    }

    let rating;
    if (bestDiff <= GS.timing.perfect) rating = 'perfect';
    else if (bestDiff <= GS.timing.great) rating = 'great';
    else if (bestDiff <= GS.timing.good) rating = 'good';
    else rating = 'miss';

    processHit(player, lane, rating);
  }
}

function processHit(player, lane, rating) {
  const st = player === 1 ? GS.p1 : GS.p2;
  const op = player === 1 ? GS.p2 : GS.p1;
  const scores = { perfect: 350, great: 200, good: 100, miss: 0 };
  const hpGain = { perfect: 2, great: 1, good: 0.5, miss: 0 };

  st[rating]++;
  st.combo++;
  if (st.combo > st.maxCombo) st.maxCombo = st.combo;
  st.score += Math.floor(scores[rating] * (1 + Math.floor(st.combo / 10) * 0.1));
  st.health = Math.min(100, st.health + hpGain[rating]);
  op.health = Math.max(5, op.health - hpGain[rating] * 0.5);

  AudioEngine.playHit(rating);
  showRating(player, lane, rating);
  updateCharAnim(player, true);
  updateHUD();

  const melodyFreqs = [262, 330, 392, 523];
  AudioEngine.playNote(melodyFreqs[lane], 0.18, player === 1 ? 'square' : 'sawtooth');
}

function processMiss(player, lane) {
  const st = player === 1 ? GS.p1 : GS.p2;
  const op = player === 1 ? GS.p2 : GS.p1;
  st.miss++;
  st.combo = 0;
  st.health = Math.max(5, st.health - 3);
  op.health = Math.min(100, op.health + 1.5);
  showRating(player, lane, 'miss');
  updateHUD();
}

// ===========================
// Game Loop
// ===========================
let animId = null, lastBeatTime = 0;

function gameLoop() {
  if (GS.paused || GS.gameOver) return;
  GS.elapsed = Date.now() - GS.startTime - GS.totalPaused;

  const bi = AudioEngine.beatInterval;
  if (GS.elapsed - lastBeatTime >= bi) {
    lastBeatTime += bi;
    AudioEngine.playBeat();
    const fl = document.getElementById('beatFlash');
    fl.style.opacity = '1';
    setTimeout(() => fl.style.opacity = '0', 80);
  }

  spawnNotes();
  updateNotes();
  updateHUD();

  if (GS.elapsed >= GS.currentSong.duration * 1000) { endSong(); return; }
  if (GS.p1.health <= 5 && GS.p2.health >= 95) { endSong(); return; }

  animId = requestAnimationFrame(gameLoop);
}

// ===========================
// Game Control
// ===========================
function startSong(index) {
  AudioEngine.init();
  GS.reset();
  GS.currentSong = SONGS[index];
  GS.pattern = generateSongPattern(GS.currentSong);
  GS.scrollSpeed = 0.32 + GS.currentSong.difficulty * 0.04;
  AudioEngine.setBPM(GS.currentSong.bpm);

  GS.screen = 'game';
  showScreen('gameScreen');

  // Countdown
  const cd = document.getElementById('countdown');
  cd.style.display = 'block';
  let count = 3;
  cd.textContent = count;
  cd.style.color = '#fbbf24';
  AudioEngine.playCountdownBeep(false);

  const cdi = setInterval(() => {
    count--;
    if (count > 0) {
      cd.textContent = count;
      cd.style.animation = 'none';
      void cd.offsetWidth;
      cd.style.animation = 'countPop 0.4s ease-out';
      AudioEngine.playCountdownBeep(false);
    } else if (count === 0) {
      cd.textContent = 'GO!';
      cd.style.color = '#4ade80';
      cd.style.animation = 'none';
      void cd.offsetWidth;
      cd.style.animation = 'countPop 0.4s ease-out';
      AudioEngine.playCountdownBeep(true);
    } else {
      cd.style.display = 'none';
      clearInterval(cdi);
      GS.startTime = Date.now();
      lastBeatTime = 0;
      animId = requestAnimationFrame(gameLoop);
    }
  }, 700);
}

function togglePause() {
  if (GS.gameOver || GS.screen !== 'game') return;
  GS.paused = !GS.paused;
  const ov = document.getElementById('pauseOverlay');
  if (GS.paused) {
    GS.pauseStart = Date.now();
    ov.style.display = 'flex';
  } else {
    GS.totalPaused += Date.now() - GS.pauseStart;
    ov.style.display = 'none';
    animId = requestAnimationFrame(gameLoop);
  }
}

function resumeGame() { if (GS.paused) togglePause(); }

function cleanupNotes() {
  GS.noteElements.forEach(el => el.remove());
  GS.noteElements.clear();
  document.querySelectorAll('.note, .rating-popup').forEach(n => n.remove());
}

function restartSong() {
  if (animId) cancelAnimationFrame(animId);
  document.getElementById('pauseOverlay').style.display = 'none';
  cleanupNotes();
  startSong(SONGS.indexOf(GS.currentSong));
}

function quitToMenu() {
  if (animId) cancelAnimationFrame(animId);
  document.getElementById('pauseOverlay').style.display = 'none';
  GS.gameOver = true;
  cleanupNotes();
  backToTitle();
}

function endSong() {
  GS.gameOver = true;
  if (animId) cancelAnimationFrame(animId);

  const won = GS.p1.score >= GS.p2.score;
  const t = document.getElementById('resultTitle');
  t.textContent = won ? '甜瓜人 获胜！' : '臭臭泥 获胜！';
  t.className = 'result-title ' + (won ? 'win' : 'lose');

  ['p1', 'p2'].forEach(p => {
    const s = GS[p];
    document.getElementById(`r-${p}-score`).textContent = s.score;
    document.getElementById(`r-${p}-perfect`).textContent = s.perfect;
    document.getElementById(`r-${p}-great`).textContent = s.great;
    document.getElementById(`r-${p}-good`).textContent = s.good;
    document.getElementById(`r-${p}-miss`).textContent = s.miss;
    document.getElementById(`r-${p}-maxcombo`).textContent = s.maxCombo;
  });

  AudioEngine.playNote(523, 0.25, 'sine');
  setTimeout(() => AudioEngine.playNote(659, 0.25, 'sine'), 180);
  setTimeout(() => AudioEngine.playNote(784, 0.4, 'sine'), 360);

  GS.screen = 'result';
  showScreen('resultScreen');
}

// ===========================
// Init
// ===========================
Input.init();
document.addEventListener('click', () => AudioEngine.init(), { once: true });
document.addEventListener('touchstart', () => AudioEngine.init(), { once: true });
</script>
